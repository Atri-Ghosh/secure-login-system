<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Login Container -->
    <div class="login-container" id="loginCard">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your credentials to access your account.</p>
        </div>
        
        <form id="loginForm" novalidate>
            <!-- Email Field -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>
                <small id="emailError" class="error-message"></small>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
                
                <!-- Password Strength Meter -->
                <div class="strength-container" id="strengthContainer">
                    <div class="strength-bars">
                        <span class="bar" id="bar1"></span>
                        <span class="bar" id="bar2"></span>
                        <span class="bar" id="bar3"></span>
                        <span class="bar" id="bar4"></span>
                    </div>
                    <span id="strengthText" class="strength-text">Password Strength</span>
                </div>
                <small id="passwordError" class="error-message"></small>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-actions-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Keep me signed in
                </label>
                <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your registered email.')">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn">Sign In</button>
            <div id="formSuccess" class="success-message"></div>
        </form>
    </div>

    <!-- Application Dashboard Area (Shown after successful login) -->
    <div class="dashboard-container hidden" id="dashboardArea">
        <div class="dashboard-card">
            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h2>Access Granted</h2>
            <p>Welcome to your application area, <span id="userEmailDisplay"></span>.</p>
            <button id="logoutBtn" class="logout-btn">Sign Out</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
